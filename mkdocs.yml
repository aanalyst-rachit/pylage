site_name: PyLage
site_description: Simple, Ultrafast, Low-Latency Python UI
site_url: https://aanalyst-rachit.github.io/pylage/
repo_name: aanalyst-rachit/pylage
repo_url: https://github.com/aanalyst-rachit/pylage

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy

nav:
  - Home: index.md
  - Getting Started:
      - First App: first_app.md
      - Installation: helper/installation.md
  - Deployment: deployment.md
  - Components:
      - Alert: component/alert.md
      - Avatar: component/avatar.md
      - Badge: component/badge.md
      - Button: component/button.md
      - Card: component/card.md
      - Checkbox: component/checkbox.md
      - Column: component/column.md
      - Confirmation Dialog: component/confirmation_dialog.md
      - Dashboard: component/dashboard.md
      - Dashboard Card: component/dashboard_card.md
      - Dashboard Grid: component/dashboard_grid.md
      - Dashboard Header: component/dashboard_header.md
      - Dashboard Section: component/dashboard_section.md
      - Data List: component/data_list.md
      - DataFrame: component/dataframe.md
      - Datepicker: component/datepicker.md
      - Dialog: component/dialog.md
      - Disabled State: component/disabled_state.md
      - Divider: component/divider.md
      - Drawer: component/drawer.md
      - Empty State: component/empty_state.md
      - Error State: component/error_state.md
      - Form: component/form.md
      - Form Field: component/form_field.md
      - Heading: component/heading.md
      - Help Text: component/help_text.md
      - Input: component/input.md
      - Loading Overlay: component/loading_overlay.md
      - Loading State: component/loading_state.md
      - Metric: component/metric.md
      - Metric Grid: component/metric_grid.md
      - Modal: component/modal.md
      - Navigation: component/navigation.md
      - Navigation Item: component/navigation_item.md
      - Popover: component/popover.md
      - Radio: component/radio.md
      - Row: component/row.md
      - Select: component/select.md
      - Slider: component/slider.md
      - Stat Group: component/stat_group.md
      - Switch: component/switch.md
      - Table: component/table.md
      - Text: component/text.md
      - Textarea: component/textarea.md
      - Toast: component/toast.md
      - Tooltip: component/tooltip.md
      - Trend: component/trend.md
  - Architecture:
      - API Audit: helper/api_audit.md
      - API Conventions: helper/api_conventions.md
      - Design Contract: helper/design_contract.md
      - Migration: helper/migration.md
  - V2:
      - Roadmap: https://github.com/aanalyst-rachit/pylage/blob/main/tracker.md
  - Releases:
      - V1.0.2 Tracker: releases/tracker_v1.0.2.md
  - Playground: https://aanalyst-rachit.github.io/pylage/playground/

markdown_extensions:
  - admonition
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.tabbed
