site_name: PyLage
site_description: Simple, Ultrafast, Low-Latency Python UI
site_url: https://aanalyst-rachit.github.io/pylage/
repo_name: aanalyst-rachit/pylage
repo_url: https://github.com/aanalyst-rachit/pylage

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy

nav:
  - Home: index.md
  - Getting Started:
      - First App: first_app.md
      - Installation: helper/installation.md
  - Components:
      - Alert: component/alert.md
      - Button: component/button.md
      - Card: component/card.md
      - Dialog: component/dialog.md
      - Drawer: component/drawer.md
      - Form: component/form.md
      - Input: component/input.md
      - Modal: component/modal.md
      - Navigation: component/navigation.md
      - Table: component/table.md
      - Toast: component/toast.md
  - Architecture:
      - API Audit: helper/api_audit.md
      - API Conventions: helper/api_conventions.md
      - Design Contract: helper/design_contract.md
      - Migration: helper/migration.md
  - V2:
      - Roadmap: https://github.com/aanalyst-rachit/pylage/blob/main/tracker.md
  - Releases:
      - V1.0.2 Tracker: releases/tracker_v1.0.2.md

markdown_extensions:
  - admonition
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.tabbed
