name: Deploy PyLage Docs

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install project and build tools
        run: pip install . build mkdocs-material

      - name: Build PyLage wheel
        run: python -m build --wheel --outdir dist

      - name: Build documentation
        run: mkdocs build --strict

      - name: Build deployed Playground
        run: |
          wheel_name="$(find dist -maxdepth 1 -type f -name 'pylage-*.whl' -printf '%f\n' | head -n 1)"
          test -n "$wheel_name"
          mkdir -p site/playground site/dist
          python -c "from pathlib import Path; from playground.app import get_app; from playground.runtime import build_playground_document; wheel=Path('dist') / '$wheel_name'; document=build_playground_document(get_app(), wheel_url=f'../dist/{wheel.name}'); Path('site/playground/index.html').write_text(document, encoding='utf-8')"
          cp "dist/$wheel_name" "site/dist/$wheel_name"

      - name: Verify Pages artifact
        run: |
          test -f site/index.html
          test -f site/playground/index.html
          wheel_name="$(find site/dist -maxdepth 1 -type f -name 'pylage-*.whl' -printf '%f\n' | head -n 1)"
          test -n "$wheel_name"
          grep -F "../dist/$wheel_name" site/playground/index.html
          grep -F "https://cdn.jsdelivr.net/pyodide/v0.29.3/full/pyodide.js" site/playground/index.html
          printf '%s\n' '--- PAGES ARTIFACT ---'
          find site -maxdepth 2 -type f | sort

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
