name: PyLage CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project and quality tools
        run: |
          python -m pip install --upgrade pip setuptools
          python -m pip install '.[test,charts]' ruff pytest build pip-audit

      - name: Install Playwright Chromium
        run: |
          python -m playwright install --with-deps chromium

      - name: Lint
        run: |
          ruff check pylage

      - name: Test
        run: |
          pytest -q

      - name: Build
        run: |
          python -m build

      - name: Security audit
        run: |
          pip-audit
